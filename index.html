<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Periodic Table Trainer</title>

  <style>
    body{
      margin:0;
      font-family:Arial;
      background:#0f172a;
      color:white;
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:100vh;
    }

    .container{
      background:#1e293b;
      width:90%;
      max-width:500px;
      padding:30px;
      border-radius:20px;
      text-align:center;
    }


  .question{
  font-size:60px;
  font-weight:bold;
  margin:20px 0;
  animation: pop 0.3s ease;
    }

    input{
      width:100%;
      padding:12px;
      border:none;
      border-radius:10px;
      margin-bottom:15px;
      box-sizing:border-box;
    }

    button{
      width:100%;
      padding:12px;
      border:none;
      border-radius:10px;
      background:#3b82f6;
      color:white;
      font-weight:bold;
      cursor:pointer;
    }

    button:hover{
      background:#2563eb;
    }

    .stats{
      display:flex;
      justify-content:space-between;
      margin-bottom:20px;
      background:#334155;
      padding:10px;
      border-radius:10px;
    }

    .modes{
      display:flex;
      gap:10px;
      margin-bottom:20px;
    }

    .modes button{
      flex:1;
    }
@keyframes pop{

  0%{
    transform:scale(0.5);
    opacity:0;
  }

  100%{
    transform:scale(1);
    opacity:1;
  }

}
    #result{
      margin-top:15px;
      font-weight:bold;
    }
  </style>
</head>
<body>

<div class="container">

  <h1>⚛️ Periodic Trainer</h1>

  <div class="stats">
    <div>🏆 <span id="bestScore">0</span></div>
    <div>⭐ <span id="score">0</span></div>
    <div>🔥 <span id="streak">0</span></div>
    <div>🎯 <span id="accuracy">0</span>%</div>
    <div>⏰ <span id="timer">10</span></div>
    <div>❤️ <span id="lives">5</span></div>
  </div>

  <div class="modes">
    <button onclick="setMode('name')">Name</button>
    <button onclick="setMode('symbol')">Symbol</button>
    <button onclick="setMode('atomic')">Atomic</button>
  </div>

  <p id="modeText">Identify Element Name</p>

  <div class="question" id="question">
    Na
  </div>

  <input
    type="text"
    id="answerInput"
    placeholder="Type answer..."
  >

  <button onclick="checkAnswer()">
    Submit
  </button>

  <p id="result"></p>

</div>

<script>

let current
let score = Number(localStorage.getItem("score")) || 0
let streak = Number(localStorage.getItem("streak")) || 0
let correct = Number(localStorage.getItem("correct")) || 0
let total = Number(localStorage.getItem("total")) || 0

let mode = "name"
let time = 10
let lives = 5
  let bestScore =
  Number(localStorage.getItem("bestScore")) || 0
  
function setMode(newMode){
  mode = newMode

  if(mode==="name"){
    document.getElementById("modeText").innerText =
      "Identify Element Name"
  }

  if(mode==="symbol"){
    document.getElementById("modeText").innerText =
      "Identify Element Symbol"
  }

  if(mode==="atomic"){
    document.getElementById("modeText").innerText =
      "Identify Atomic Number"
  }
setInterval(() => {

  time--

  document.getElementById("timer").innerText = time

  if(time <= 0){

    streak = 0
lives--

document.getElementById("lives").innerText = lives

if(lives <= 0){

  alert("Game Over!")

  lives = 5
  score = 0

  document.getElementById("score").innerText = score
  document.getElementById("lives").innerText = lives
}

    time = 10
document.getElementById("score").innerText = score
document.getElementById("streak").innerText = streak

const savedAccuracy =
  total > 0
  ? Math.round((correct / total) * 100)
  : 0

document.getElementById("accuracy").innerText =
  savedAccuracy
if(score > bestScore){

  bestScore = score

  localStorage.setItem("bestScore", bestScore)

  document.getElementById("bestScore").innerText =
    bestScore
}

localStorage.setItem("score", score)
localStorage.setItem("streak", streak)
localStorage.setItem("correct", correct)
localStorage.setItem("total", total)
    
document.getElementById("bestScore").innerText =
  bestScore
    generateQuestion()
  }

}, 1000)
  generateQuestion()
}

function generateQuestion(){

  current =
    elements[Math.floor(Math.random()*elements.length)]

  if(mode==="name"){
    document.getElementById("question").innerText =
      current.symbol
  }

  if(mode==="symbol"){
    document.getElementById("question").innerText =
      current.name
  }

  if(mode==="atomic"){
    document.getElementById("question").innerText =
      current.name
  }

  document.getElementById("answerInput").value=""
}

function checkAnswer(){

  const input =
    document.getElementById("answerInput").value.trim()

  let answer=""

  if(mode==="name"){
    answer=current.name
  }

  if(mode==="symbol"){
    answer=current.symbol
  }

  if(mode==="atomic"){
    answer=current.atomic.toString()
  }

  total++

  if(input.toLowerCase()===answer.toLowerCase()){

    score++
    streak++
    correct++

    document.getElementById("result").innerText =
      "✅ Correct!"
    
    document.getElementById("correctSound").play()

  }else{

    streak=0

    document.getElementById("result").innerText =
      "❌ Correct Answer: " + answer
    document.getElementById("wrongSound").play()
  }

  const accuracy =
    Math.round((correct/total)*100)

  document.getElementById("score").innerText=score
  document.getElementById("streak").innerText=streak
  document.getElementById("accuracy").innerText=accuracy

time = 10

setTimeout(generateQuestion,1200)
}

window.addEventListener("keydown",function(e){
  if(e.key==="Enter"){
    checkAnswer()
  }
})

generateQuestion()

</script>
<audio id="correctSound"
